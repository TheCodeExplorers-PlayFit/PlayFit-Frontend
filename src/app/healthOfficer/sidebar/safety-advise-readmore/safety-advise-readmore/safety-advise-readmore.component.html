<div class="container-fluid" [style.marginTop]="marginTop">
  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 text-muted">Loading safety advice...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="alert alert-danger" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    {{ error }}
  </div>

  <!-- Content -->
  <div *ngIf="!loading && !error && healthTip" class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <!-- Back Button -->
      <div class="mb-4">
        <button class="btn btn-outline-secondary" (click)="goBack()">
          <i class="bi bi-arrow-left"></i> Back to Safety Advice
        </button>
      </div>

      <!-- Article Header -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <!-- Category Badge -->
          <div class="mb-3">
            <span class="badge bg-primary fs-6">{{ healthTip.category }}</span>
          </div>

          <!-- Title -->
          <h1 class="card-title display-6 fw-bold mb-4">{{ healthTip.title }}</h1>

          <!-- Meta Information -->
          <div class="d-flex align-items-center text-muted mb-4">
            <i class="bi bi-calendar3 me-2"></i>
            <span class="me-4">{{ formatDate(healthTip.createdAt) }}</span>
            <i class="bi bi-clock me-2"></i>
            <span class="me-4">{{ timeAgo(healthTip.createdAt) }}</span>
            <i class="bi bi-person-badge me-2"></i>
            <span>Health Officer</span>
          </div>

          <!-- Featured Image -->
          <div *ngIf="healthTip.image_url" class="mb-4">
            <img 
              [src]="healthTip.image_url" 
              [alt]="healthTip.title" 
              class="img-fluid rounded shadow-sm"
              style="max-height: 400px; width: 100%; object-fit: cover;">
          </div>

          <!-- Content -->
          <div class="article-content">
            <div [innerHTML]="healthTip.content" class="fs-5 lh-lg"></div>
          </div>

          <!-- Action Buttons -->
          <div class="d-flex gap-2 mt-4 pt-4 border-top">
            <button class="btn btn-outline-primary" (click)="shareArticle()">
              <i class="bi bi-share"></i> Share
            </button>
            <button class="btn btn-outline-success" (click)="printArticle()">
              <i class="bi bi-printer"></i> Print
            </button>
            <button class="btn btn-outline-info" (click)="bookmarkArticle()">
              <i class="bi bi-bookmark"></i> Bookmark
            </button>
          </div>
        </div>
      </div>

      <!-- Related Articles Section -->
      <div class="card shadow-sm">
        <div class="card-header">
          <h5 class="card-title mb-0">
            <i class="bi bi-collection me-2"></i>Related Safety Tips
          </h5>
        </div>
        <div class="card-body">
          <div *ngIf="relatedTips.length > 0" class="row">
            <div class="col-md-6 mb-3" *ngFor="let tip of relatedTips">
              <div class="card h-100 border-0 bg-light">
                <div class="card-body">
                  <h6 class="card-title">{{ tip.title }}</h6>
                  <p class="card-text text-muted small">{{ extractText(tip.content) }}</p>
                  <a [routerLink]="['/health/safety-advise-readmore', tip.id]" class="btn btn-sm btn-primary">
                    Read More
                  </a>
                </div>
              </div>
            </div>
          </div>
          <div *ngIf="relatedTips.length === 0" class="text-center text-muted py-3">
            <i class="bi bi-info-circle me-2"></i>
            No related articles found.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
