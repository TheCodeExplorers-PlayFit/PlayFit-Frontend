<br><br>
<form [formGroup]="injuryForm" (ngSubmit)="submitInjury()" class="container mt-4 border p-4 rounded shadow-sm bg-light">
  <h1 class="mb-4">Record Injury Details</h1>
  <h4>1. Player Information</h4>
  <br>
  <div class="row mb-3">
    <!-- player name -->
    <div class="col-md-6">
      <label for="player_name" class="form-label">Player Name:</label>
      <input type="text" id="player_name" placeholder="Enter player name" class="form-control" formControlName="player_name" required>
    </div>
  
    <!-- player id -->
    <div class="col-md-6">
      <label for="player_id" class="form-label">Player ID:</label>
      <input type="text" id="player_id" placeholder="Enter player ID" class="form-control" formControlName="player_id" required>
    </div>
  </div>

  <div class="row mb-3">
    <!-- age -->
    <div class="col-md-6">
      <label for="age" class="form-label">Age:</label>
      <input type="number" id="age" placeholder="Enter player age" class="form-control" formControlName="age" required min="1">
    </div>

  </div>
  <br>
  <hr>
  <h4>2. Injury Details</h4>
  <br>
  <div class="row mb-3">
      <!-- injury day -->
    <div class="col-md-6">
      <label for="date_of_injury" class="form-label">Date of Injury:</label>
      <input type="date" id="date_of_injury" class="form-control" formControlName="date_of_injury" required>
    </div>

        <!-- injury time -->
        <div class="col-md-6">
          <label for="time_of_injury" class="form-label">Time of Injury:</label>
          <input type="time" id="time_of_injury" class="form-control" formControlName="time_of_injury" required>
        </div>
  </div>
 
  <div class="row mb-3">
      <!-- injury type -->
    <div class="col-md-6">
      <label for="type_of_injury" class="form-label ">Type of Injury:</label>
      <select id="type_of_injury"  class="form-select" formControlName="type_of_injury" required>
        <option value="" disabled selected class="text-muted">Select type of injury</option>
        <option *ngFor="let type of injuryTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

     <!-- Injury Severity -->
     <div class="col-md-6">
      <label for="injury_severity" class="form-label">Injury Severity</label>
      <select id="injury_severity" class="form-select" formControlName="injury_severity" required>
        <option value="" disabled selected class="text-muted">Select injury severity</option>
        <option *ngFor="let level of injuryServerity" [value]="level">{{ level }}</option>
      </select>
    </div>
  </div>
<br><hr> 

<h4>3. Incident Details</h4>
<br>
  <div class="row mb-3">
   <!-- first aid given -->
    <div class="col-md-6">
      <label for="first_aid_given" class="form-label d-block">First Aid Given:</label>
      <div class="form-check form-switch">
        <input type="checkbox" style="margin-left: 3px;" id="first_aid_given" class="form-check-input" formControlName="first_aid_given">
        <label class="form-check-label" for="first_aid_given"></label>
      </div>
    </div>

    <!-- <div class="col-md-6">
      <label for="health_officer_id" class="form-label">Health Officer Id:</label>
      <input type="text" id="health_officer_id" class="form-control" formControlName="health_officer_id" required>
    </div> -->
  </div>
  <div class="row mb-3">
    <div class="col-md-6">
      <label for="treatment_plan" class="form-label">Treatment Plan:</label>
      <textarea id="treatment_plan" class="form-control" formControlName="treatment_plan" rows="3"></textarea>
    </div>
  </div>

<br>
<hr>
<h4>4. Upload Medical Reports/X-rays</h4>
<br>
<div class="row mb-3">
  <div class="col-md-6">
    <label for="medical_files" class="form-label">Upload X-Ray/Medical Reports:</label>
    <input type="file" id="medical_files" class="form-control" multiple (change)="onFileSelected($event)" accept=".jpg,.jpeg,.png,.pdf">
    <small class="form-text text-muted">Accepted formats: JPG, PNG, PDF. Max 5 files.</small>
  </div>
</div>

<div class="row mb-3" *ngIf="selectedFiles.length > 0">
  <div class="col-md-6">
    <p><strong>Selected Files:</strong></p>
    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let file of selectedFiles; let i = index">
        {{ file.name }}
        <button type="button" class="btn btn-sm btn-danger" (click)="removeFile(i)">Remove</button>
      </li>
    </ul>
  </div>
</div>
<div *ngIf="uploading">
  <p>Uploading files, please wait...</p>
</div>

<br>
  <button type="submit" class="btn w-50" [ngStyle]="{'background-color': primaryColor,'color':'#ffffff'}" [disabled]="injuryForm.invalid">Submit Injury Record</button>
</form>
