<h1 [style.marginLeft]="marginLeft" [style.marginTop]="marginTop">Record Injury Details</h1>
<br>
<div class="record-injuries container" [ngStyle]="{'margin-left' :marginLeft1}" >
  <div class="bd-example p-3" [style.marginLeft]="marginLeft" [ngStyle]="{'margin-left': contentMarginLeft,'background-color':bgColor1}">
    <form>
      <h4>1. Player Information</h4>
      <br>
      <!-- player name -->
      <div class="form-group row">
        <label for="inputname" class="col-sm-2 col-form-label">Player Name :</label>
        <div class="col-sm-10">
          <input type="text" class="form-control text-center" id="inputname" [placeholder]="placeholder1"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
        </div>
      </div> <br>

      <!-- player id -->
      <div class="form-group row">
        <label for="inputID" class="col-sm-2 col-form-label">Player ID :</label>
        <div class="col-sm-10">
          <input type="text" class="form-control text-center" id="inputID" [placeholder]="placeholder2"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}" [maxLength]="idSize">
        </div>
      </div>
      <br>

      <!-- player age -->
      <div class="form-group row">
        <label for="inputAge" class="col-sm-2 col-form-label">Age :</label>
        <div class="col-sm-10">
          <input type="number" class="form-control text-center" id="inputAge" [placeholder]="placeholder3"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
        </div>
      </div>
      <br>   

      <hr>
      <br>
      <h4>2. Injury Details</h4>
      <br>

      <!-- injury day -->
      <div class="form-group row">
        <label for="inputInjuryDate" class="col-sm-2 col-form-label">Date of Injury :</label>
        <div class="col-sm-10">
          <input type="date" class="form-control text-center" id="inputInjuryDate" [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
        </div>
      </div> <br>

      <!-- injury date -->
      <div class="form-group row">
        <label for="inputInjuryTime" class="col-sm-2 col-form-label">Time of Injury :</label>
        <div class="col-sm-10">
          <input type="time" class="form-control text-center" id="inputInjuryTime" [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
        </div>
      </div> <br>  

      <!-- type of injury -->
      <div class="form-group row">
        <label for="inputSelectTypeInjury" class="col-sm-2 col-form-label">Type of Injury :</label> 
        <div class="col-sm-10">
          <div class="dropdown-wrapper">
            <select class="form-control text-center" id="inputSelectTypeInjury" [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
              <option value="" disabled selected  >Select type of injury</option>
              <option *ngFor="let injury of injuryTypes">{{injury}}</option>
            </select>
            <i class="bi bi-chevron-down dropdown-icon"></i> <!-- Bootstrap Icon -->
          </div>
          </div>
     </div>  
      <br>

     <!-- injury severity type -->
     <div class="form-group row">
      <label for="inputSelectInjuryServerity" class="col-sm-2 col-form-label">Injury Serverity :</label> 
      <div class="col-sm-10">
        <div class="dropdown-wrapper">
          <select class="form-control text-center" id="inputSelectInjuryServerity" [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
            <option value="" disabled selected  >Select injury serverity</option>
            <option [value]="serverity.indexOf" *ngFor="let serverity of injuryServerity">{{serverity}}</option>
          </select>
          <i class="bi bi-chevron-down dropdown-icon"></i> <!-- Bootstrap Icon -->
        </div>
        </div>
   </div>  
    <br>

   <!-- injury location -->
   <div class="form-group row">
    <label for="inputInjuryLocation" class="col-sm-2 col-form-label">Injury Location :</label> 
    <div class="col-sm-10">
      <div class="dropdown-wrapper">
        <select class="form-control text-center" id="inputInjuryLocation" [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
          <option value="" disabled selected  >Select injury location</option>
          <option [value]="injlocation.indexOf" *ngFor="let injlocation of injuryLocation">{{injlocation}}</option>
        </select>
        <i class="bi bi-chevron-down dropdown-icon"></i> <!-- Bootstrap Icon -->
      </div>
      </div>
 </div>  
  <br>

  <hr>
  <br>
  <h4>3. Incident Details</h4>
  <br>

  <!-- injury description -->
  <div class="form-group row">
    <label for="inputDescription" class="col-sm-2 col-form-label">Description of Injury :</label>
    <div class="col-sm-10">
      <textarea class="form-control" id="inputDescription" rows="4"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}" [maxLength]="idSize"></textarea>
    </div>
  </div>
  <br>

       <!-- cause of injury -->
       <div class="form-group row">
        <label for="inputinjuryCause" class="col-sm-2 col-form-label">Cause of injury :</label> 
        <div class="col-sm-10">
          <div class="dropdown-wrapper">
            <select class="form-control text-center" id="inputinjuryCause" [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
              <option value="" disabled selected  >Select cause of injury</option>
              <option [value]="cause.indexOf" *ngFor="let cause of injuryCause">{{cause}}</option>
            </select>
            <i class="bi bi-chevron-down dropdown-icon"></i> <!-- Bootstrap Icon -->
          </div>
          </div>
     </div>  
      <br>

      <!-- first aid give or not-->
    <div class="form-group row">
      <fieldset class="form-group">
        <div class="row">
          <legend class="col-form-label col-sm-2 pt-0">First Aid given ?</legend>
          <div class="col-sm-10 d-flex gap-5">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1" value="option1" checked="">
              <label class="form-check-label" for="gridRadios1">
                Yes
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2" value="option2">
              <label class="form-check-label" for="gridRadios2">
               No
              </label>
            </div>
          
          </div>
        </div>
      </fieldset>
    </div>
<br>

    <!-- first aid details -->
    <div class="form-group row">
      <label for="firstAidDetails" class="col-sm-2 col-form-label">First Aid Details :</label>
      <div class="col-sm-10">
        <textarea class="form-control" id="inputDescription" rows="4"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}" [maxLength]="idSize"></textarea>
      </div>
    </div>
    <small [ngStyle]="{'margin-left': contentMarginLeft,'color':textBlueColor}" class="form-text text-muted">If you fill only yes above question</small>
    <br> 
<br>
<!-- docotr details -->
<div class="form-group row">
  <label for="inputDname" class="col-sm-2 col-form-label">Doctor/Health Officer Name :</label>
  <div class="col-sm-10">
    <input type="text" class="form-control text-center" id="inputDname" [placeholder]="placeholder4"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
  </div>
</div> <br>
    <!-- diagnosis -->
    <div class="form-group row">
      <label for="diagnosis" class="col-sm-2 col-form-label">Diagnosis :</label>
      <div class="col-sm-10">
        <textarea class="form-control" id="diagnosis" rows="4"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}" [maxLength]="idSize"></textarea>
      </div>
    </div>
<br>

<!-- treatment plan -->
<div class="form-group row">
  <label for="inputTreatments" class="col-sm-2 col-form-label">Treatment Plan :</label>
  <div class="col-sm-10">
    <textarea class="form-control" id="inputTreatments" rows="4"  [ngStyle]="{'width' : barWidth,'background-color':bgColor}" [maxLength]="idSize"></textarea>
  </div>
</div>
<br>

<!-- xrays reports -->
<div class="form-group row">
  <label for="inputreports" class="col-sm-2 col-form-label">Upload Medical Reports/X-rays :</label>
  <div class="col-sm-10">
    <input class="form-control" type="file" id="formFile" [ngStyle]="{'width' : barWidth,'background-color':bgColor}">
  </div>
</div> <br><br>


<button type="submit" class="btn btn-primary mx-2" [ngStyle]="{'background-color': primaryColor, 'border-color': primaryColor,'width':marginLeft}">Save</button>
<button type="submit" class="btn btn-primary" disabled [ngStyle]="{'background-color': primaryColor, 'border-color': primaryColor,'width':marginLeft}">Reset Form</button>

    </form>
    </div>
</div>

<!-- bootstrap-icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
