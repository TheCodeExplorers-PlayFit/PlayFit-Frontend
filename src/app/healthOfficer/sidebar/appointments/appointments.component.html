<!-- appointments.component.html -->
<h1 class="p-1" [style.marginTop]="marginTop">Appointments</h1>
<div class="container">
  <h3 class="mb-4" class="text-muted">Appointment Requests</h3>
  <table class="table table-bordered table-striped">
    <thead class="table table-primary">

      <tr>
        <th>ID</th>
        <th>Player</th>
        <th>Date</th>
        <th>Time</th>
        <th>Reason</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let appointment of appointments || [];">
        <td>{{ appointment.id }}</td>
        <td>{{ appointment.first_name }}</td>
        <td>{{ appointment.appointment_date }}</td>
        <td>{{ appointment.appointment_time }}</td>
        <td>{{ appointment.reason }}</td>
        <td [ngClass]="getStatusClass(appointment.status)">{{ appointment.status }}</td>
        <td>
          <select class="form-select" (change)="onStatusChange($event, appointment)">


            <option value="">Select Action</option>
            <option value="Approved">Approve</option>
            <option value="Rejected">Reject</option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>
</div>
