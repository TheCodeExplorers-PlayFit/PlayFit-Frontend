<div class="container-fluid p-4">
  <h2 class="fw-bold mb-4">Players’ Health Records</h2>

  <div class="row">
    <!-- LEFT PANEL -->
    <div class="col-md-5">
      <!-- Filter/Search -->
      <div class="input-group mb-3">
        <span class="input-group-text bg-light border-0">
          🔍
        </span>
        <input type="text" class="form-control" placeholder="Select Player" disabled>
      </div>

      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-outline-dark btn-sm">All</button>
        <button class="btn btn-outline-dark btn-sm">Oldest</button>
        <button class="btn btn-outline-dark btn-sm">Newest</button>
      </div>

      <!-- Player List -->
      <div *ngFor="let player of appointments" class="card mb-2 shadow-sm"
           [class.border-primary]="selectedPlayer?.id === player.id"
           (click)="selectPlayer(player)" style="cursor: pointer;">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="fw-semibold">{{ player.first_name }} {{ player.last_name }}</div>
            <small class="text-primary">{{ player.age }} years</small>
          </div>
          <div class="text-secondary fs-5">➔</div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="col-md-7">
      <div *ngIf="selectedPlayer" class="bg-light p-4 rounded shadow-sm">
        <div class="d-flex align-items-center mb-3">
          <div class="rounded-circle bg-secondary text-white d-flex justify-content-center align-items-center me-3" style="width: 50px; height: 50px;">
            👤
          </div>
          <h5 class="mb-0">{{ selectedPlayer.first_name }} {{ selectedPlayer.last_name }}</h5>
        </div>

        <p class="mb-1"><strong>Age:</strong> <span class="text-primary">{{ selectedPlayer.age }} years</span></p>
        <p class="mb-1"><strong>Phone Number:</strong> 
          <a [href]="'tel:' + selectedPlayer.mobile_number">{{ selectedPlayer.mobile_number }}</a>
        </p>
        <p class="mb-3"><strong>Email:</strong> {{ selectedPlayer.email }}</p>

        <button class="btn btn-primary" (click)="goToAddInjury(selectedPlayer.id)">
          Add Injury details
        </button>
      </div>
    </div>
  </div>
</div>
