<form (ngSubmit)="onSubmit()" class="container-fluid p-4" style="max-width: 600px; margin: 0 auto;" [style.marginTop]="marginTop">
  <div class="mb-4">
    <h1 class="mb-2">{{ editMode ? 'Edit Safety Advice & Tips' : 'Add Safety Advice & Tips' }}</h1>
<p class="text-muted">Share your expertise on sports health, recovery, and wellness.</p>

  </div>

  <!-- Title Input -->
  <div class="mb-3">
    <label for="title" class="form-label fw-medium">Enter Title</label>
    <input 
      type="text" 
      id="title"
      [(ngModel)]="title" 
      name="title" 
      class="form-control" 
      placeholder="Effective Recovery Strategies for Athletes"
      required>
  </div>

  <!-- Category Select -->
  <div class="mb-3">
    <label for="category" class="form-label fw-medium">Category</label>
    <select 
      id="category"
      [(ngModel)]="category" 
      name="category" 
      class="form-select" 
      required>
      <option value="" disabled selected>Nutrition</option>
      <option *ngFor="let cat of categoryList" [value]="cat">{{ cat }}</option>
    </select>
  </div>

  <!-- Content Editor -->
  <div class="mb-3">
    <label class="form-label fw-medium">Content</label>
    
    <!-- Toolbar -->
    <div class="border border-bottom-0 bg-light p-2 rounded-top">
      <div class="d-flex gap-1">
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('bold')" title="Bold">
          <strong>B</strong>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('italic')" title="Italic">
          <em>I</em>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('underline')" title="Underline">
          <u>U</u>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('strikeThrough')" title="Strikethrough">
          <s>T</s>
        </button>
        <div class="vr mx-1"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('insertUnorderedList')" title="Bullet List">
          ≡
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('insertOrderedList')" title="Numbered List">
          1.
        </button>
        <div class="vr mx-1"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('createLink')" title="Link">
          🔗
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('insertImage')" title="Image">
          🖼️
        </button>
        <div class="vr mx-1"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('justifyLeft')" title="Align Left">
          ⬅️
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="formatText('justifyCenter')" title="Align Center">
          ↔️
        </button>
      </div>
    </div>

    <!-- Editor Area -->
    <div 
      #editor 
      contenteditable="true" 
      class="form-control border-top-0 rounded-bottom" 
      style="min-height: 200px; resize: vertical; overflow-y: auto;"
      (input)="onContentChange()"
      (paste)="onPaste($event)">
    </div>
  </div>

  <!-- Image Upload -->
  <div class="mb-4">
    <label class="form-label fw-medium">Featured Image</label>
    <p class="text-muted small mb-2">Upload button to add a thumbnail image</p>
    
    <div 
      class="border border-2 border-dashed rounded p-5 text-center"
      [class.border-primary]="isDragOver"
      [class.bg-light]="isDragOver"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="inputImage.click()"
      style="cursor: pointer; min-height: 120px; display: flex; flex-direction: column; justify-content: center;">
      
      <div *ngIf="!selectedImage">
        <div class="mb-3">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-muted">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21,15 16,10 5,21"/>
          </svg>
        </div>
        <p class="mb-1 text-muted">Drop your image here, or browse</p>
        <p class="small text-muted">Supports: JPG, JPEG, PNG</p>
      </div>

      <div *ngIf="selectedImage" class="position-relative">
        <img [src]="selectedImage" class="img-fluid rounded" style="max-height: 200px;">
       <button 
  type="submit" 
  class="btn btn-primary"
  [disabled]="submitting || !isFormValid()">
  <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
  {{ editMode ? 'Update Tip' : 'Publish' }}
</button>

      </div>
    </div>

    <input 
      type="file" 
      #inputImage 
      accept="image/*" 
      class="d-none"
      (change)="onImageSelect($event)">
  </div>

  <!-- Action Buttons -->
  <div class="d-flex gap-2">
    <button 
      type="button" 
      class="btn btn-outline-secondary"
      (click)="onCancel()">
      Cancel
    </button>
    <button 
      type="submit" 
      class="btn btn-primary"
      [disabled]="submitting || !isFormValid()">
      <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
      Publish
    </button>
  </div>
</form>
