<div class="container py-4" *ngIf="blogs.length; else noBlogs">
  <div class="row g-4 justify-content-center">
    <div *ngFor="let blog of blogs" class="col-12 col-md-6 col-lg-4 d-flex">
      <div class="card flex-fill shadow-sm border-0 h-100" style="border-radius: 22px; box-shadow: 0 8px 32px rgba(0,0,0,0.08);">
        
        <img 
          *ngIf="blog.image" 
          [src]="blog.image" 
          alt="Blog Image" 
          class="card-img-top" 
          style="height: 210px; object-fit: cover; border-top-left-radius: 22px; border-top-right-radius: 22px;" 
        />

        <div class="card-body d-flex flex-column" style="background: #f3f6fa; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;">
          <h5 class="card-title mb-3 fw-semibold" style="color: #000080;">{{ blog.title }}</h5>
          <p class="card-text text-muted mb-4 flex-grow-1" style="color: #1b185a;">
            {{ blog.content | slice:0:140 }}<span *ngIf="blog.content.length > 140">...</span>
          </p>
          <p class="small mb-1" style="color: #000080;">
            Posted by: <strong>{{ blog.first_name }} {{ blog.last_name }}</strong> ({{ blog.role }})
          </p>
          <p class="small" style="color: #000080;">
            On: {{ blog.created_at | date:'medium' }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #noBlogs>
  <div class="container py-4">
    <p class="text-center text-muted fs-5">No approved blogs to display.</p>
  </div>
</ng-template>
