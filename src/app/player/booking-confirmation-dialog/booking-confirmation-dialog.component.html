<div class="dialog-container">
    <h2>Confirm Booking</h2>
    <p>The Cost of this session is {{ data.cost | currency:'LKR':'symbol':'1.2-2' }} if you like to pay now</p>
    <div class="dialog-actions">
      <button mat-button color="warn" (click)="cancel()">Cancel Booking</button>
      <button mat-raised-button color="primary" (click)="confirm()">Pay Now</button>
    </div>
  </div>
