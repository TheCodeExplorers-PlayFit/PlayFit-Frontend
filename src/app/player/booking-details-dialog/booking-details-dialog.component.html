<div class="dialog-container">
    <h2>Booking Confirmed</h2>
    <div class="booking-details">
      <p><strong>Sport:</strong> {{ data.sportName }}</p>
      <p><strong>Stadium:</strong> {{ data.stadiumName }}</p>
      <p><strong>Location:</strong> {{ data.locationName }}</p>
      <p><strong>Date:</strong> {{ data.sessionDate }}</p>
      <p><strong>Time:</strong> {{ data.startTime }} - {{ data.endTime }}</p>
      <p><strong>Address:</strong> {{ data.address }}</p>
      <p><strong>Coach:</strong> {{ data.coachName }}</p>
    </div>
    <div class="dialog-actions">
      <button mat-raised-button color="primary" (click)="navigateToStadium()">Navigate to Stadium</button>
      <button mat-button (click)="close()">Close</button>
    </div>
  </div>
