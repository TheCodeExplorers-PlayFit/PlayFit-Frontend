<div class="d-flex flex-row gap-3" [style.marginLeft]="marginLeft" [style.marginTop]="marginTop">
  <div class="card-container" *ngFor="let card of cards">
    <div class="card" [style.backgroundColor]="card.backgroundColor">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <a [routerLink]="card.route" class="card-subtitle">{{ card.subtitle }}</a>
        </div>
        <hr class="card-divider">
        <p class="card-text">{{ card.text }}</p>
      </div>
    </div>
  </div>
</div>
