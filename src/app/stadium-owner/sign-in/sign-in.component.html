<!-- <div class="sign-up container" [style.marginTop]="marginTop" [ngStyle]="{'margin-left' :marginLeft}"> -->
    <div class="d-flex justify-content-start gap-5 flex-nowrap">
      <!-- <div class="left-side" [ngStyle]="{'margin-Right':marginRight}"> -->
        <img [src]="imageUrl" alt="side image" [style.height]="imageHight" [style.width]="imagewidth">
      </div>
      <div class="right-side p-2 mx-4" >
        <h1>Personal Information</h1>
        <span>Provide the necessary details to register with us</span>
          <br><br><br>
        <div class="bd-example">
          <form>
            <!-- mobile number section -->
            <!-- <div class="form-group" [ngStyle]="{'width':contentWidth}"> -->
              <label for="exampleFormControlInput1">Mobile Number</label><br> <br>
              <input type="number" class="form-control" id="exampleFormControlInput1" [placeholder]="mobilenum" maxlength="10">
            <!-- </div> -->
            <br>
              <!--Age section -->
            <!-- <div class="form-group" [ngStyle]="{'width':contentWidth}"> -->
              <label for="exampleFormControlInput1">Age</label><br> <br>
              <input type="number" class="form-control" id="exampleFormControlInput1" [placeholder]="age">
            <!-- </div> -->
            <br>
              <!-- Gender section -->
            <!-- <div class="form-group  position-relative" [ngStyle]="{'width':contentWidth}"> -->
              <label for="exampleFormControlSelect1">Gender</label><br><br>
              
              <div class="dropdown-wrapper">
              <select class="form-control" id="exampleFormControlSelect1">
                <option value="" disabled selected  >Select Your Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
              <i class="bi bi-chevron-down dropdown-icon"></i> <!-- Bootstrap Icon -->
            </div>
            <!-- </div> -->
            <br>
              <!--NIC section -->
               <!-- <div class="form-group" [ngStyle]="{'width':contentWidth}"> -->
                 <label for="exampleFormControlInput1">NIC Number</label><br> <br>
                 <input type="text" class="form-control" id="exampleFormControlInput1" [placeholder]="nic">
                 <!-- </div> -->
                 <br>
  
               <!--health officer verification --> 
            <div class="form-group">
              <div class="mb-3">
                <label for="exampleFormfile"  class="form-label">Health Officer Verification</label><br> 
                <small>To verify your designation as a Health Officer, please upload the necessary proof documents.</small>
                  <br><br>
                  <small style="color: red;">Only Scanned copies of original documents can be uploaded.</small>
                  <br> 
                  <input class="form-control" type="file" id="formFile">
              </div>
              <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>
             <br>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1"><span>I agree to the <a href="#" [style.color]="primaryColor" style="text-decoration: none;">terms & conditions.</a></span></label>
            </div>
            <br>
            <!-- <button type="submit" class="btn btn-primary" [ngStyle]="{'background-color': primaryColor, 'border-color': primaryColor,'width':contentWidth}">Sign Up</button> -->
            
          </form>
          </div>
      </div>
    <!-- </div> -->
  <!-- </div> -->
  <!-- bootstrap-icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
