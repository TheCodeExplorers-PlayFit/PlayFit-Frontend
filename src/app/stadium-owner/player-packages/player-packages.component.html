<div class="container">
  <h2>Player Packages</h2>
  <button class="add-package-btn" (click)="enableAdd()">Add New Package</button>

  <div *ngIf="packages.length; else noPackages">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Price ($)</th>
          <th>Duration (Days)</th>
          <th>Sport</th>
          <th>Stadium</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pkg of packages">
          <td>{{ pkg.name }}</td>
          <td>{{ pkg.description || 'N/A' }}</td>
          <td>{{ pkg.price }}</td>
          <td>{{ pkg.duration }}</td>
          <td>{{ pkg.sport }}</td>
          <td>{{ pkg.stadium_name }}</td>
          <td>
            <button class="edit-btn" (click)="enableEdit(pkg)">Edit</button>
            <button class="delete-btn" (click)="deletePackage(pkg.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <ng-template #noPackages>
    <p>No player packages available. Add a new package to get started!</p>
  </ng-template>

  <!-- Add Modal -->
  <div class="modal" [ngClass]="{'show': showAdd}">
    <div class="modal-content">
      <h3>Add New Package</h3>
      <form (ngSubmit)="saveAdd()">
        <label>Name:</label>
        <input type="text" class="form-control" [(ngModel)]="newPackage.name" name="name" required />

        <label>Description:</label>
        <textarea class="form-control" [(ngModel)]="newPackage.description" name="description"></textarea>

        <label>Price ($):</label>
        <input type="number" class="form-control" [(ngModel)]="newPackage.price" name="price" min="0" step="0.01" required />

        <label>Duration (Days):</label>
        <input type="number" class="form-control" [(ngModel)]="newPackage.duration" name="duration" min="1" required />

        <label>Sport:</label>
        <input type="text" class="form-control" [(ngModel)]="newPackage.sport" name="sport" required />

        <label>Stadium:</label>
        <select class="form-control" [(ngModel)]="newPackage.stadium_id" name="stadium_id" required>
          <option value="">Select a stadium</option>
          <option *ngFor="let stadium of stadiums" [value]="stadium.id">{{ stadium.name }}</option>
        </select>

        <button type="submit" class="add-package-btn btn-sm">Add Package</button>
        <button type="button" class="edit-btn btn-sm" (click)="cancelAdd()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" [ngClass]="{'show': showEdit}">
    <div class="modal-content">
      <h3>Edit Package</h3>
      <form (ngSubmit)="saveEdit()">
        <label>Name:</label>
        <input type="text" class="form-control" [(ngModel)]="editedPackage.name" name="name" required />

        <label>Description:</label>
        <textarea class="form-control" [(ngModel)]="editedPackage.description" name="description"></textarea>

        <label>Price ($):</label>
        <input type="number" class="form-control" [(ngModel)]="editedPackage.price" name="price" min="0" step="0.01" required />

        <label>Duration (Days):</label>
        <input type="number" class="form-control" [(ngModel)]="editedPackage.duration" name="duration" min="1" required />

        <label>Sport:</label>
        <input type="text" class="form-control" [(ngModel)]="editedPackage.sport" name="sport" required />

        <label>Stadium:</label>
        <select class="form-control" [(ngModel)]="editedPackage.stadium_id" name="stadium_id" required>
          <option value="">Select a stadium</option>
          <option *ngFor="let stadium of stadiums" [value]="stadium.id">{{ stadium.name }}</option>
        </select>

        <button type="submit" class="add-package-btn btn-sm">Save</button>
        <button type="button" class="edit-btn btn-sm" (click)="cancelEdit()">Cancel</button>
      </form>
    </div>
  </div>
</div>
