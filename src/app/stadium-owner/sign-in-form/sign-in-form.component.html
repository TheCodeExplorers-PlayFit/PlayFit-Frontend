<div class="signup-container">
    <!-- Left Section: Image -->
    <div class="left-section">
      <img src="https://i.postimg.cc/FHdKFZmm/c14df25b7b8798e175fa54d794f18618.jpg" alt="Player Image" class="player-image">
    </div>
  
    <!-- Right Section: Form -->
    <div class="right-section">
      <h1 class="form-title">Personal Information</h1>
  
      <!-- Mobile Number -->
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" placeholder="Enter Your Mobile Number" class="input-field">
      </div>
  
      <!-- NIC -->
      <div class="form-group">
        <label>NIC Number</label>
        <input type="text" placeholder="Enter Your NIC Number" class="input-field">
      </div>
  
      <!-- Gender -->
      <div class="form-group">
        <label>Gender</label>
        <select class="input-field">
          <option value="" disabled selected>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
       
  
      <!-- Terms & Conditions -->
      <div class="form-group terms-group">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the <a href="#" class="terms-link">terms & conditions</a></label>
      </div>
  
      <!-- Sign Up Button -->
      <button class="signup-btn">Sign Up</button>
  
      <!-- Already Have an Account -->
      <p class="signin-text">Already have an account? <a href="#" class="signin-link">Sign In</a></p>
    </div>
  </div>
