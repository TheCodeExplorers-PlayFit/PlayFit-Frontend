<div class="container">
  <div class="content">
    <h2>Add Stadium</h2>
    <p>Provide the necessary details</p>

    <form (ngSubmit)="onSubmit()" #formRef="ngForm">
      <label>Stadium Name:</label>
      <input type="text" [(ngModel)]="stadium.name" name="name" placeholder="Enter your stadium name" />

      <label>Stadium ID:</label>
      <input type="text" [(ngModel)]="stadium.id" name="id" placeholder="Enter your stadium ID" />

      <label>Address:</label>
      <input type="text" [(ngModel)]="stadium.address" name="address" placeholder="Enter your address" />

      <label>Add sports:</label>
      <input type="text" [(ngModel)]="stadium.sports" name="sports" placeholder="Enter sports available" />

      <label>Facilities:</label>
      <input type="text" [(ngModel)]="stadium.facilities" name="facilities" placeholder="Enter facilities" />

      <label>Upload images of stadium:</label>
      <input type="file" (change)="onFileSelected($event)" multiple />
      <div class="image-preview">
        <img *ngFor="let img of imagePreviews" [src]="img" alt="Image preview" />
      </div>

      <label>Location:</label>
      <input
        type="text"
        [(ngModel)]="stadium.locationText"
        name="locationText"
        placeholder="Type a location..."
        (keyup.enter)="locateAddress()"
      />
      <button type="button" (click)="locateAddress()">Find on Map</button>

      <div id="map" class="map-box"></div>

      <div class="form-group terms-group">
        <input type="checkbox" id="terms" [(ngModel)]="agreed" name="terms" />
        <label for="terms">I agree to the <a href="#" class="terms-link">terms & conditions</a></label>
      </div>

      <button type="submit" [disabled]="!agreed || !formRef.form.valid">Submit</button>
    </form>
  </div>
</div>
