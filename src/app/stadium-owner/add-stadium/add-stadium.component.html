<div class="container">
  
    <div class="content">
      <h2>Add Stadium</h2>
      <p>Provide the necessary details</p>
  
      <form>
        <label>Stadium Name:</label>
        <input type="text" placeholder="Enter your stadium name" />
  
        <label>Stadium ID:</label>
        <input type="text" placeholder="Enter your stadium ID" />
  
        <label>Address:</label>
        <input type="text" placeholder="Enter your address" />
  
        <label>Add sports:</label>
        <input type="text" placeholder="Enter sports available in your stadium" />
  
        <label>Facilities:</label>
        <input type="text" placeholder="Enter facilities available in your stadium" />
  
        <label>Upload images of stadium:</label>
        <div class="upload-box">
          <i class="upload-icon"></i>
          <p>Drag and drop or browse files</p>
        </div>
  
        <label>Location:</label>
        <input type="text" placeholder="Enter your location" />
  
        <div class="map-box">
          <img src="assets/images/map-placeholder.png" alt="Map" />
        </div>

        <!-- Terms & Conditions -->
      <div class="form-group terms-group">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the <a href="#" class="terms-link">terms & conditions</a></label>
      </div>

  
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
