<div class="private-requests">
    <h2>Private Playing Requests</h2>
    <div class="request" *ngFor="let request of requests">
      <p><strong>{{ request.name }}</strong> has requested a private coaching session</p>
      <p>Stadium: {{ request.stadium }}</p>
      <p>Date: {{ request.date }}</p>
      <p>Time: {{ request.time }}</p>
      <button class="approve">Approve</button>
      <button class="decline">Decline</button>
      <button class="profile">Profile</button>
    </div>
  </div>
