<p>stadium-list works!</p>
<div class="stadium-list-container">
  <h2>Stadiums available in Moratuwa area</h2>
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  <div class="stadium-grid">
    <div *ngFor="let stadium of stadiums" class="stadium-card">
      <img [src]="stadium.images?.[0] || 'https://via.placeholder.com/300'" alt="{{stadium.name}}" width="300">
      <h3>{{stadium.name}}</h3>
      <p>{{stadium.description}}</p>
      <a routerLink="/coach/stadium-detail" routerLinkActive="active">Read more</a>
    </div>
  </div>
</div>
