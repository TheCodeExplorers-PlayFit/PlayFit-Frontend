<div class="dialog-container">
  <h2>Rate {{ data.entityName }}</h2>
  <mat-form-field appearance="outline">
    <mat-label>Rating (1-5)</mat-label>
    <mat-select [(ngModel)]="rating">
      <mat-option *ngFor="let num of [1, 2, 3, 4, 5]" [value]="num">{{ num }}</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Comment (optional)</mat-label>
    <textarea matInput [(ngModel)]="comment" rows="4"></textarea>
  </mat-form-field>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <div class="actions">
    <button mat-button color="warn" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="submitRating()">Submit</button>
  </div>
</div>
