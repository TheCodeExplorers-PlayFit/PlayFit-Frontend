<div class="container">
  <h2>Your Salary Details</h2>

  <!-- Loading state -->
  <div *ngIf="loading" class="spinner">Loading...</div>

  <!-- Error state -->
  <div *ngIf="error && !loading" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Salary cards -->
  <div *ngIf="coachSalaries.length > 0 && !loading" class="salary-box">
    <div *ngFor="let salary of coachSalaries" class="salary-card">
      <p><strong> Your Coach ID:</strong> {{ salary.coach_id }}</p>
      <p><strong> Your Name:</strong> {{ salary.coach_name || 'N/A' }}</p>
      <p><strong> Total Salary:</strong> {{ salary.total_salary | currency:'USD' }}</p>
    </div>
  </div>

  
  <!-- Button to generate PDF -->
  <button class="pdf-btn" (click)="generateSalaryReport()">Download Your Salary Report</button>

  <!-- No data state -->
  <div *ngIf="coachSalaries.length === 0 && !error && !loading" class="alert alert-info">
    No salary data available.
  </div>
</div>
