<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salary Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      min-height: 100vh;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .salary-center-container {
      background: #f3f6fa;
      max-width: 600px;
      width: 100%;
      margin: 48px auto;
      padding: 44px 32px 30px 32px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      border: 1.2px solid #ececff;
    }
    .salary-title {
      color: #000080;
      font-weight: 700;
      text-align: center;
      margin-bottom: 36px;
      letter-spacing: 1.5px;
    }
    .salary-details-card {
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.09);
      border: none;
    }
    .salary-label {
      color: #000080;
      font-weight: 600;
    }
    .salary-data {
      color: #212944;
      font-size: 1.05em;
      font-weight: 500;
    }
    .salary-amount {
      font-size: 1.5em;
      color: #009e60 !important;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .btn-success {
      background: linear-gradient(90deg, #2e3192 60%, #000080 100%);
      border-color: #2e3192;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 12px rgba(50,130,90,0.09);
      border-radius: 17px;
      font-size: 1.04em;
    }
    .btn-success i { font-size: 1.18em; }
    .btn-success:hover, .btn-success:focus {
      background: #000080;
      border-color: #000080;
      color: #fff;
    }
    /* Alerts, spinner, responsive tweaks */
    .alert-info, .alert-danger {
      border-radius: 13px;
      font-size: 1.04em;
    }
    .spinner-border {
      color: #000080 !important;
    }
    @media (max-width: 700px) {
      .salary-center-container {
        padding: 24px 8px 24px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="salary-center-container">

    <!-- Title -->
    <h2 class="salary-title">
      <i class="bi bi-currency-dollar me-2"></i>
      Your Salary Details
    </h2>

    <!-- Loading Spinner -->
    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error && !loading" class="alert alert-danger text-center py-3 fs-5">
      {{ error }}
    </div>

    <!-- Salary Details Card -->
    <div *ngIf="!loading && coachSalaries.length > 0" class="card salary-details-card mb-4">
      <div class="card-body px-4 py-4">
        <div *ngFor="let salary of coachSalaries" class="mb-3">
          <p class="mb-1">
            <span class="salary-label">Coach ID:</span>
            <span class="salary-data ms-2">{{ salary.coach_id }}</span>
          </p>
          <p class="mb-1">
            <span class="salary-label">Name:</span>
            <span class="salary-data ms-2">{{ salary.coach_name || 'N/A' }}</span>
          </p>
          <p>
            <span class="salary-label">Total Salary:</span>
            <span class="salary-amount ms-2">${{ salary.total_salary | number:'1.2-2' }}</span>
          </p>
        </div>
        <!-- PDF Download Button -->
        <div class="text-end mt-3">
          <button class="btn btn-success px-5 py-2 shadow-sm" (click)="generateSalaryReport()">
            <i class="bi bi-download me-2"></i> Download Salary Report
          </button>
        </div>
      </div>
    </div>

    <!-- No Data Message -->
    <div *ngIf="coachSalaries.length === 0 && !loading && !error"
         class="alert alert-info text-center mt-5 fs-5">
      No salary data available.
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
