<div class="blog-container">
  <h2>Post a Blog</h2>

  <div *ngIf="message" class="alert alert-info">{{ message }}</div>

  <form (ngSubmit)="submitBlog()" novalidate>
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" id="title" class="form-control" [(ngModel)]="title" name="title" required />
    </div>

    <div class="mb-3">
      <label for="content" class="form-label">Content</label>
      <textarea id="content" class="form-control" rows="5" [(ngModel)]="content" name="content" required></textarea>
    </div>

    <div class="mb-3">
      <label for="image" class="form-label">Optional Image</label>
      <input type="file" id="image" class="form-control" (change)="onFileSelected($event)" />
    </div>

    <button type="button" class="btn btn-primary" (click)="submitBlog()">Submit</button>
  </form>
</div>
