<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post a Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blog-container {
      background: #f3f6fa;
      max-width: 600px;
      width: 100%;
      margin: 60px auto 0 auto;
      padding: 36px 28px 34px 28px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      position: relative;
      /* Optional: slight border for focus */
      border: 1.5px solid #ececff;
      z-index: 1;
    }
    .blog-container h2 {
      color: #000080;
      font-weight: bold;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: 0.01em;
    }
    .form-label {
      color: #000080;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-control {
      border-radius: 10px;
      border: 1.5px solid #b0b3d6;
      background: #fff;
      color: #1b185a;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-size: 1.05rem;
    }
    .form-control:focus {
      border-color: #000080;
      box-shadow: 0 0 0 2px rgba(0,0,128,0.10);
    }
    .form-control[type="file"] {
      background: #f3f6fa;
      padding: 7px 12px;
    }
    .btn-primary {
      background: linear-gradient(90deg, #2e3192 70%, #000080 100%);
      border-color: #2e3192;
      color: #fff;
      font-weight: 600;
      padding: 10px 36px;
      border-radius: 10px;
      font-size: 1.04em;
      box-shadow: 0 2px 8px 0 rgba(41,51,140,0.11);
      transition: background 0.2s, box-shadow 0.2s, border 0.2s;
    }
    .btn-primary:hover {
      background: #000080;
      border-color: #000080;
      box-shadow: 0 7px 16px 0 rgba(41,51,140,0.12);
      color: #fff;
    }
    .alert-info {
      background: #e3eafd;
      border-color: #b4c5ee;
      color: #c62c48;
      border-radius: 8px;
      font-size: 1.05em;
      margin-bottom: 18px;
    }
    /* Responsive */
    @media (max-width: 700px) {
      .blog-container {
        padding: 20px 5vw;
        margin: 25px auto;
      }
    }
  </style>
</head>
<body>
  <div class="blog-container">
    <h2>
      <i class="bi bi-pencil-square me-2"></i>
      Post a Blog
    </h2>

    <div *ngIf="message" class="alert alert-info">{{ message }}</div>

    <form (ngSubmit)="submitBlog()" novalidate>
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" id="title" class="form-control" [(ngModel)]="title" name="title" required />
      </div>

      <div class="mb-3">
        <label for="content" class="form-label">Content</label>
        <textarea id="content" class="form-control" rows="5" [(ngModel)]="content" name="content" required></textarea>
      </div>

      <div class="mb-3">
        <label for="image" class="form-label">Optional Image</label>
        <input type="file" id="image" class="form-control" (change)="onFileSelected($event)" />
      </div>

      <button type="button" class="btn btn-primary" (click)="submitBlog()">
        <i class="bi bi-upload me-2"></i>
        Submit
      </button>
    </form>
  </div>
</body>
</html>
