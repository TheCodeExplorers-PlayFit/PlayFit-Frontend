<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f8f9fa;
    }
    .center-container {
      width: 100%;
      max-width: 800px;
      padding: 40px 20px;
      background: #f3f6fa; /* Soft light background for a modern look */
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .booking-card {
      transition: all 0.3s ease-in-out;
    }
    .booking-card:hover {
      transform: scale(1.01);
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .custom-navy {
      color: #000080 !important;
    }
    .custom-navy-bg {
      background-color: #000080 !important;
      color: #fff !important;
    }
    .custom-navy-border {
      border-color: #000080 !important;
    }
  </style>
</head>
<body>
  <div class="center-container mt-5">
    <div class="text-center mb-5">
      <h2 class="fw-bold custom-navy">
        <i class="bi bi-calendar2-check-fill me-2"></i>Booking History
      </h2>
      <p class="text-secondary">All your previous reservations in one place</p>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="loading" class="text-center my-4">
      <div class="spinner-border custom-navy" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error && !loading" class="alert alert-danger text-center shadow-sm">
      {{ error }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && !error && bookings.length === 0" class="alert alert-warning text-center shadow-sm">
      <i class="bi bi-exclamation-circle me-2"></i>No bookings found.
    </div>

    <!-- Booking Cards -->
    <div *ngIf="!loading && bookings.length > 0" class="row justify-content-center g-4">
      <div class="col-md-10" *ngFor="let booking of bookings; let i = index">
        <div class="card booking-card shadow-sm rounded-4 bg-white border-0 custom-navy-border">
          <div class="card-body">
            <h5 class="card-title custom-navy">
              <i class="bi bi-building me-1"></i> {{ booking.clubName }}
            </h5>
            <p class="mb-1 text-secondary small">Booking #{{ i + 1 }}</p>
            <hr/>
            <p class="mb-2">
              <i class="bi bi-calendar-event custom-navy me-2"></i>
              <strong>Date:</strong> {{ booking.date }}
            </p>
            <p>
              <i class="bi bi-clock text-danger me-2"></i>
              <strong>Time:</strong> {{ booking.time }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
