<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    .booking-card {
      transition: all 0.3s ease-in-out;
    }
    .booking-card:hover {
      transform: scale(1.01);
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .shift-container {
      padding-top: 60px;
      max-width: 600px; /* Fix container width */
      /* No margin-left needed, row justifies content right */
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-end">
      <div class="col-lg-8 shift-container">
        <div class="text-start mb-5">
          <h2 class="fw-bold text-primary">
            <i class="bi bi-calendar2-check-fill me-2"></i>Booking History
          </h2>
          <p class="text-secondary">All your previous reservations in one place</p>
        </div>

        <!-- Loading -->
        <div *ngIf="loading" class="text-center my-4">
          <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!-- Error -->
        <div *ngIf="error && !loading" class="alert alert-danger text-center shadow-sm">
          {{ error }}
        </div>

        <!-- Empty -->
        <div *ngIf="!loading && !error && bookings.length === 0" class="alert alert-warning text-center shadow-sm">
          <i class="bi bi-exclamation-circle me-2"></i>No bookings found.
        </div>

        <!-- Bookings Cards -->
        <div *ngIf="!loading && bookings.length > 0" class="row g-4">
          <div class="col-md-10" *ngFor="let booking of bookings; let i = index">
            <div class="card booking-card shadow-sm rounded-4 bg-white border-0">
              <div class="card-body">
                <h5 class="card-title text-primary">
                  <i class="bi bi-building me-1"></i> {{ booking.clubName }}
                </h5>
                <p class="mb-1 text-secondary small">Booking #{{ i + 1 }}</p>
                <hr/>
                <p class="mb-2">
                  <i class="bi bi-calendar-event text-success me-2"></i>
                  <strong>Date:</strong> {{ booking.date }}
                </p>
                <p>
                  <i class="bi bi-clock text-danger me-2"></i>
                  <strong>Time:</strong> {{ booking.time }}
                </p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
