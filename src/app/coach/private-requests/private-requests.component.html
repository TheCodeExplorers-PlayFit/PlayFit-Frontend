<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Playing Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .min-vh-100 {
      min-height: 100vh; /* Full viewport height to center content vertically */
    }
    .private-requests {
      padding-top: 8rem; /* Increased top padding to push content further down */
    }
    .approve {
      background-color: #28a745;
      color: white;
    }
    .decline {
      background-color: #dc3545;
      color: white;
    }
    .profile {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <div class="d-flex flex-column justify-content-center min-vh-100">
    <div class="container my-4 private-requests">
      <h2 class="mb-4">Private Playing Requests</h2>

      <div *ngFor="let request of requests" class="card mb-3 shadow-sm">
        <div class="card-body">
          <p class="mb-2"><strong>{{ request.name }}</strong> has requested a private coaching session</p>
          <p class="mb-1">Stadium: {{ request.stadium }}</p>
          <p class="mb-3">Date: {{ request.date }} | Time: {{ request.time }}</p>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-sm approve">Approve</button>
            <button class="btn btn-sm decline">Decline</button>
            <button class="btn btn-sm profile">Profile</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
