<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Session Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    html, body {
      height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f8f9fa;
    }
    .center-container {
      width: 100%;
      max-width: 1200px; /* increased width */
      padding: 60px 30px; /* increased vertical padding */
      background: #f3f6fa;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      min-height: 90vh; /* increased height */
      margin-left: 250px; /* shift right */
    }
    .session-card {
      margin: 1rem;
      border: none;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: all 0.3s cubic-bezier(.4,0,.2,1);
    }
    .session-card:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 6px 24px rgba(0,0,0,0.13);
    }
    .custom-navy {
      color: #000080 !important;
    }
    .custom-navy-bg {
      background-color: #000080 !important;
      color: #fff !important;
    }
    .session-icon {
      color: #000080; 
      font-size: 1.6rem; 
      margin-right: 8px;
      vertical-align: middle;
    }
    @media (max-width: 767.98px) {
      .center-container {
        padding: 30px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="center-container mt-5">
    <h2 class="fw-bold mb-5 custom-navy">
      <i class="bi bi-people-fill me-2"></i>Session Details
    </h2>
    <div *ngIf="error" class="alert alert-danger mb-4" role="alert">{{ error }}</div>
    <div *ngIf="sessions?.length; else noSessions" class="row g-4">
      <div *ngFor="let session of sessions" class="col-12 col-md-4">
        <div class="card session-card h-100">
          <div class="card-body">
            <h3 class="card-title h5 fw-bold mb-3 custom-navy">
              <i class="bi bi-key session-icon"></i> Session ID: {{ session.sessionId }}
            </h3>
            <p class="mb-2">
              <i class="bi bi-calendar-event session-icon"></i>
              <strong>Date:</strong> {{ session.date }}
            </p>
            <p class="mb-2">
              <i class="bi bi-clock-history session-icon"></i>
              <strong>Time:</strong> {{ session.startTime }} - {{ session.endTime }}
            </p>
            <p class="mb-2">
              <i class="bi bi-person-badge session-icon"></i>
              <strong>Number of Players:</strong> {{ session.playerCount }}
            </p>
            <p>
              <i class="bi bi-people-fill session-icon"></i>
              <strong>Players:</strong>
              <span *ngIf="session.players?.length; else noPlayers">
                {{ session.players.join(', ') }}
              </span>
              <ng-template #noPlayers>
                None
              </ng-template>
            </p>
          </div>
        </div>
      </div>
    </div>
    <ng-template #noSessions>
      <div class="alert alert-info text-center mt-4" role="alert">
        No sessions found.
      </div>
    </ng-template>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
