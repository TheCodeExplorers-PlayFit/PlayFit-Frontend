<div class="signup-container">
  <!-- Left Section: Image -->
  <div class="left-section">
    <img src="https://i.postimg.cc/FHdKFZmm/c14df25b7b8798e175fa54d794f18618.jpg" alt="Player Background" class="background-image">
  </div>

  <!-- Right Section: Form -->
  <div class="right-section">
    <h1 class="form-title">Player Information</h1>

    <!-- Mobile Number -->
    <div class="form-group">
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="Enter your mobile number" class="input-field">
    </div>

    <!-- Age -->
    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" placeholder="Enter your age" class="input-field">
    </div>

    <!-- Gender -->
    <div class="form-group">
      <label for="gender">Gender</label>
      <select id="gender" class="input-field">
        <option value="" disabled selected>Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>

    <!-- NIC -->
    <div class="form-group">
      <label for="nic">NIC</label>
      <input type="text" id="nic" placeholder="Enter your NIC" class="input-field">
      <p class="hint-text">Must be at least 8 characters</p>
    </div>

    <!-- Health Issues -->
    <div class="form-group">
      <label>Do you have any health issues?</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="health-issues" value="no" [(ngModel)]="healthIssues" (change)="toggleHealthIssues('no')"> No
        </label>
        <label>
          <input type="radio" name="health-issues" value="yes" [(ngModel)]="healthIssues" (change)="toggleHealthIssues('yes')"> Yes
        </label>
      </div>
      <textarea *ngIf="healthIssues === 'yes'" placeholder="Please describe your health issues" class="input-field textarea-field"></textarea>
    </div>

    <!-- Terms & Conditions -->
    <div class="form-group terms-group">
      <input type="checkbox" id="terms">
      <label for="terms">I agree to the <a href="#" class="terms-link">terms & conditions</a></label>
    </div>

    <!-- Submit Button -->
    <button class="primary-btn">Sign Up</button>

    <!-- Already Have an Account -->
    <p class="account-text">Already have an account? <a routerLink="/signin" class="accent-link">Sign In</a></p>
  </div>
</div>
