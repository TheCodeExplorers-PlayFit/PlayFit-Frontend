<div class="approvals-wrapper">
  <h2>Approve Registration Requests</h2>

  <div class="filters">
    <button [class.active]="filter === 'Peoples'" (click)="filter = 'Peoples'">Peoples</button>
    <button [class.active]="filter === 'Stadiums'" (click)="filter = 'Stadiums'">Stadiums</button>
  </div>

  <div class="approval-list">
    <div class="approval-card" *ngFor="let request of filteredRequests">
      <div class="info">
        <img [src]="request.photo" alt="{{request.name}}" />
        <div>
          <strong>{{ request.name }}</strong>
          <p>{{ request.role }}</p>
        </div>
      </div>
      <div class="actions">
        <a *ngIf="request.documentPath" [href]="request.documentPath" target="_blank" download>Download document</a>
        <button class="approve" (click)="approveRequest(request)">Approve</button>
        <button class="pending">{{ request.status }}</button>
        <button class="reject" (click)="rejectRequest(request)">Reject</button>
      </div>
    </div>
  </div>
</div>
