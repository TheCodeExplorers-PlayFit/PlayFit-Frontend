<div class="admin-dashboard">
    <header class="header">
      <h1>Sports Management System - Admin Dashboard</h1>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </header>
    <main class="content">
      <div class="welcome-message">
        <h2>Welcome, Admin!</h2>
        <p>Manage users, sports, stadiums, and view reports from here.</p>
      </div>
      <div class="quick-stats">
        <div class="stat-card">
          <h3>Total Users</h3>
          <p>{{ stats.totalUsers }}</p>
        </div>
        <div class="stat-card">
          <h3>Total Sports</h3>
          <p>{{ stats.totalSports }}</p>
        </div>
        <div class="stat-card">
          <h3>Total Stadiums</h3>
          <p>{{ stats.totalStadiums }}</p>
        </div>
      </div>
      <div class="recent-actions">
        <h3>Recent Actions</h3>
        <ul>
          <li *ngFor="let action of recentActions">{{ action }}</li>
        </ul>
      </div>
    </main>
  </div>
