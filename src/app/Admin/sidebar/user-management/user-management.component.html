<div class="user-management-container">
  <h2>User Management</h2>

  <input type="text" [(ngModel)]="searchTerm" placeholder="Search a user..." class="search-bar"/>

  <div class="user-cards">
    <div class="card" *ngFor="let user of filteredUsers.slice(0, 3)">
      <img [src]="user.photo" alt="{{ user.name }}" />
      <h4>{{ user.name }}</h4>
      <span>{{ user.role }}</span>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of filteredUsers">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.phone }}</td>
        <td>{{ user.role }}</td>
        <td>
          <span [ngClass]="{
            'active': user.status === 'Active',
            'pending': user.status === 'Pending',
            'suspended': user.status === 'Suspended'
          }">{{ user.status }}</span>
        </td>
        <td>
          <button class="view-btn">👁️</button>
          <button class="edit-btn">✏️</button>
          <button class="delete-btn">❌</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
