<div class="user-management-container">
  <h2>User Management</h2>

  <div class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Search by First Name</mat-label>
      <input
        matInput
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
        placeholder="Enter first name..."
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filter by Role</mat-label>
      <mat-select
        [(value)]="selectedRole"
        (selectionChange)="onRoleChange()"
      >
        <mat-option value="all">All Roles</mat-option>
        <mat-option value="player">Player</mat-option>
        <mat-option value="coach">Coach</mat-option>
        <mat-option value="stadiumOwner">Stadium Owner</mat-option>
        <mat-option value="medicalOfficer">Medical Officer</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-table [dataSource]="filteredUsers">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let user">{{ user.name }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
      <mat-cell *matCellDef="let user">{{ user.email }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="phone">
      <mat-header-cell *matHeaderCellDef>Phone</mat-header-cell>
      <mat-cell *matCellDef="let user">{{ user.phone }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="role">
      <mat-header-cell *matHeaderCellDef>Role</mat-header-cell>
      <mat-cell *matCellDef="let user">{{ user.role }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let user">
        <button mat-icon-button (click)="viewProfile(user.id)" color="primary">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteUser(user.id)" color="warn">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>
