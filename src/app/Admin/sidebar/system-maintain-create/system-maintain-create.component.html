<div class="container">
    <h2>System Maintenance</h2>
  
    <label>Upload a Photo</label>
    <div class="upload-box">
      <input type="file" accept="image/*" (change)="onFileSelected($event)" />
      <p>Drop your image here, or <span class="browse">browse</span></p>
    </div>
  
    <label>Add a Notice</label>
    <textarea [(ngModel)]="notice" placeholder="Type your notice here..."></textarea>
  
    <div class="toggle">
      <label>Maintain mode</label>
      <input type="checkbox" [(ngModel)]="maintenanceMode" />
    </div>
  
    <button (click)="saveData()">Save</button>
  </div>
